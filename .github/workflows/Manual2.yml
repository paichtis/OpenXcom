name: Manual

on:
  workflow_dispatch:

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        shell: bash
        run: |
          echo "DATEFILE=`git log -1 --date=format:\"%Y_%m_%d_%H%M\" --format=\"%ad\"`" >> $GITHUB_ENV
          echo "DATEVERSION=`git log -1 --date=format:\"%Y-%m-%d %H:%M\" --format=\"%ad\"`" >> $GITHUB_ENV

      - name: Setup version info
        shell: bash
        run: |
          sed -i "s/GAME_VERSION_GIT \"[^\"]*\"/GAME_VERSION_GIT \" git ${{ env.DATEVERSION }}\"/" install/win/version.nsh
          sed -i "s/GAME_DATE_GIT \"[^\"]*\"/GAME_DATE_GIT \"${{ env.DATEFILE }}\"/" install/win/version.nsh
          sed -i "s/OPENXCOM_VERSION_GIT \"[^\"]*\"/OPENXCOM_VERSION_GIT \" git ${{ env.DATEVERSION }}\"/" src/version.h
          echo "FILENAME=oxce_git_${{ env.DATEFILE }}" >> $GITHUB_ENV

      - name: Install XP Toolset
        shell: powershell
        run: |
          Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
          $InstallPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $WorkLoads = '--add Microsoft.VisualStudio.Component.WinXP'
          $Arguments = ('/c', "vs_installer.exe", 'modify', '--installPath', "`"$InstallPath`"", $WorkLoads, '--quiet', '--norestart', '--nocache')
          $process = Start-Process -FilePath cmd.exe -ArgumentList $Arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -eq 0) {
              Write-Host "components have been successfully added"
          } else {
              Write-Host "components were not installed"
          }

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Compile source (x86 only)
        env:
          VC_FLAGS: /v:minimal /m /p:BuildInParallel=true /p:PreferredToolArchitecture=x64 /p:Configuration=Release_XP
        run: |
          cd src
          msbuild OpenXcom.2010.sln ${{ env.VC_FLAGS }} /p:Platform=Win32
          cd ..
          Rename-Item -Path "bin\Win32\Release_XP" -NewName "Release"

      # 🔧 AJOUT : Téléchargement et copie des DLL SDL
      - name: Download and copy SDL DLLs
        shell: powershell
        run: |
          # Créer le dossier temporaire
          New-Item -ItemType Directory -Path "dlls" -Force

          # Télécharger les archives SDL 1.2
          Invoke-WebRequest -Uri "https://www.libsdl.org/release/SDL-1.2.15-win32.zip" -OutFile "dlls\SDL.zip"
          Invoke-WebRequest -Uri "https://www.libsdl.org/projects/SDL_mixer/release/SDL_mixer-1.2.12-win32.zip" -OutFile "dlls\SDL_mixer.zip"
          Invoke-WebRequest -Uri "https://www.libsdl.org/projects/SDL_image/release/SDL_image-1.2.12-win32.zip" -OutFile "dlls\SDL_image.zip"

          # Extraire les archives
          Expand-Archive -Path "dlls\SDL.zip" -DestinationPath "dlls\SDL"
          Expand-Archive -Path "dlls\SDL_mixer.zip" -DestinationPath "dlls\SDL_mixer"
          Expand-Archive -Path "dlls\SDL_image.zip" -DestinationPath "dlls\SDL_image"

          # Copier les DLL vers le dossier de sortie
          Copy-Item "dlls\SDL\SDL.dll" -Destination "bin\Win32\Release\" -Force
          Copy-Item "dlls\SDL_mixer\SDL_mixer.dll" -Destination "bin\Win32\Release\" -Force
          Copy-Item "dlls\SDL_image\SDL_image.dll" -Destination "bin\Win32\Release\" -Force

        # Gestion de SDL_gfx : pas de binaire officiel. 
        # Si nécessaire, vous pouvez le compiler ou le récupérer ailleurs.
        # Si le projet n'en a pas besoin, ignorez cette ligne.
        # Copy-Item "chemin\vers\SDL_gfx.dll" -Destination "bin\Win32\Release\" -Force
    
      - name: Create nightly ZIP (x86 only)
        shell: powershell
        run: |
          New-Item -ItemType "directory" -Path "artifacts"
          Compress-Archive -Path "bin\Win32\Release\OpenXcom.exe", "bin\Win32\*.dll", "bin\common", "bin\standard", "bin\TFTD", "bin\UFO", "LICENSE.txt" -DestinationPath "artifacts\${{ env.FILENAME }}_win32_xp.zip"

      - name: Generate build log
        run: |
          # Simplification : on prend les 10 derniers commits sans dépendre de nx-set-shas
          git log --pretty=format:"<strong>%an, %ad</strong>%n%B" -n 10 --date=iso-local > artifacts\${{ env.FILENAME }}.log

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILENAME }}_windows
          path: artifacts/*

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        run: |
          echo "DATEFILE=`git log -1 --date=format:\"%Y_%m_%d_%H%M\" --format=\"%ad\"`" >> $GITHUB_ENV
          echo "DATEVERSION=`git log -1 --date=format:\"%Y-%m-%d %H:%M\" --format=\"%ad\"`" >> $GITHUB_ENV
          echo "CMAKE_BUILD_PARALLEL_LEVEL=`getconf _NPROCESSORS_ONLN 2>/dev/null || getconf NPROCESSORS_ONLN 2>/dev/null || echo 2`" >> $GITHUB_ENV

      - name: Setup version info
        run: |
          sed -i "s/OPENXCOM_VERSION_GIT \"[^\"]*\"/OPENXCOM_VERSION_GIT \" git ${{ env.DATEVERSION }}\"/" src/version.h
          echo "FILENAME=oxce_git_${{ env.DATEFILE }}" >> $GITHUB_ENV

      - name: Install packages
        run: |
          sudo apt-get update
          # Ajout de quelques paquets supplémentaires souvent nécessaires
          sudo apt-get -yq --no-install-suggests --no-install-recommends install \
            appstream libfuse2 libsdl1.2-dev libsdl-mixer1.2-dev libsdl-image1.2-dev libsdl-gfx1.2-dev \
            libyaml-cpp-dev libboost-system-dev libboost-filesystem-dev libboost-program-options-dev

      - name: Install LinuxDeploy
        uses: miurahr/install-linuxdeploy-action@v1
        with:
          plugins: appimage

      - name: Compile source code
        run: |
          cmake . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          make -j$(nproc)
          make install DESTDIR=AppDir

      - name: Generate AppImage
        run: |
          rm -rf AppDir/usr/share/openxcom/UFO
          rm -rf AppDir/usr/share/openxcom/TFTD
          linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
          mkdir artifacts
          mv OpenXcom-x86_64.AppImage artifacts/${{ env.FILENAME }}-x86_64.AppImage

      - name: Generate build log
        run: |
          git log --pretty=format:"<strong>%an, %ad</strong>%n%B" -n 10 --date=iso-local > artifacts/${{ env.FILENAME }}.log

      - name: Create .tar.gz archive
        run: tar -czvf ${{ env.FILENAME }}_linux.tar.gz -C artifacts .

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILENAME }}_linux.tar.gz
          path: ${{ env.FILENAME }}_linux.tar.gz

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        run: |
          echo "DATEFILE=`git log -1 --date=format:\"%Y_%m_%d_%H%M\" --format=\"%ad\"`" >> $GITHUB_ENV
          echo "DATEVERSION=`git log -1 --date=format:\"%Y-%m-%d %H:%M\" --format=\"%ad\"`" >> $GITHUB_ENV
          echo "CMAKE_BUILD_PARALLEL_LEVEL=`getconf _NPROCESSORS_ONLN 2>/dev/null || getconf NPROCESSORS_ONLN 2>/dev/null || echo 2`" >> $GITHUB_ENV

      - name: Setup version info
        run: |
          sed -i '' "s|OPENXCOM_VERSION_GIT \"[^\"]*\"|OPENXCOM_VERSION_GIT \" git ${{ env.DATEVERSION }}\"|" src/version.h
          echo "FILENAME=oxce_git_${{ env.DATEFILE }}" >> $GITHUB_ENV

      - name: Install libraries (macOS)
        uses: melusina-org/setup-macports@v1
        id: macports
        with:
          parameters: scripts/macports-config.yml

      - name: Compile source code
        run: |
          CMAKE_EXTRA_ARGS=(-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64")
          if [ -d /opt/local/share/doc/sdl12-compat ]
          then
            echo "SDL12-compat detected, linking SDL2 as well"
            CMAKE_EXTRA_ARGS+=("-DEXTRA_XCOM_LIBS=/opt/local/lib/libSDL2.dylib")
          fi
          cmake . -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/opt/local -G Ninja -B build "${CMAKE_EXTRA_ARGS[@]}"
          cmake --build build

      - name: Create an archive with .app in it
        run: |
          mkdir artifacts
          ditto -c -k --sequesterRsrc --keepParent build/openxcom.app artifacts/${{ env.FILENAME }}_mac.zip

      - name: Generate build log
        run: |
          git log --pretty=format:"<strong>%an, %ad</strong>%n%B" -n 10 --date=iso-local > artifacts/${{ env.FILENAME }}.log

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILENAME }}_macos
          path: artifacts/*
